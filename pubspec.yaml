name: dafter_yawmi
description: الدفتر اليومي للأستاذ — تطبيق إدارة التوقيت الأسبوعي والتوزيع السنوي وخطة سير الدروس.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.2.3
  google_fonts: ^6.2.1
  path_provider: ^2.1.3
  share_plus: ^12.0.2
  uuid: ^4.4.0
  provider: ^6.1.2
  file_picker: ^10.3.10
  pdf: ^3.12.0
  printing: ^5.13.4
  excel: ^4.0.6

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/dafter_yawmi_icon.png"
  min_sdk_android: 21
